# Route 1 Phase 1B: Boundary-guarded memory selection (12.5% reserve, default)
# Based on A_Dtrain_Etrain, mode: boundary_guarded
plugins:
  pseudo_conf_mask:
    enabled: true
    threshold: 0.85
    min_valid_ratio: 0.01
    min_valid_pixels: 0
    ignore_index: 255
    fallback: 'skip'
  efficient_tam_memory:
    enabled: true
    mode: 'pool'
    compress_ratio: 0.5
    pool_stride: 2
    apply_in_pl: false
    apply_in_train: true
  efficient_sam2_sparse:
    enabled: true
    mode: 'boundary_guarded'
    keep_ratio: 0.5
    min_keep_tokens: 64
    saliency_source: 'feature_norm'
    cache_saliency: true
    fallback_full_when_uncertain: true
    apply_in_pl: false
    apply_in_train: true
    boundary_reserve_ratio: 0.125  # 12.5% reserve for boundary
