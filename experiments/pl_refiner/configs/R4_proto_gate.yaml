# experiments/pl_refiner/configs/R4_proto_gate.yaml
# R4 proto_gate: adds prototype-based gating on top of R3 (plq_basic).
# Prototype distances used to suppress noisy pseudo labels.
#
# experiment_id      : R4_proto_gate
# refiner_mode       : proto_gate
# use_class_balance  : true
# use_plq            : true
# use_prototype      : true
# use_correction     : false
# use_memory_consistency: false
# memory_config      : none
# full_train_allowed : true
# status             : NOT_IMPLEMENTED_YET — requires adaptation/pseudo_label/prototype_bank.py

pseudo_label_refiner:
  mode: "proto_gate"
  enable: true
  class_balance:
    top_ratio: 0.67
    min_pixels_per_class: 10
    num_classes: 13
  plq:
    use_entropy: true
    use_local_agreement: true
    local_kernel_size: 3
    weight_power: 1.0
  prototype:
    feat_key: "feat_t_de"   # use decoder features (B, 256, H', W')
    distance_metric: "cosine"
    gate_threshold: 0.5     # suppress if cosine dist > threshold
    ema_momentum: 0.99
    num_classes: 13

plugins:
  pseudo_conf_mask:
    enabled: true
    threshold: 0.85
  efficient_tam_memory:
    enabled: false
  efficient_sam2_sparse:
    enabled: false

reuse_pl_dir: data_pd_exp_final_2000/base_last_20260425_232941/DensePASS/sam2_s/Cityscapes_13cls/epoch1
train_max_iters: 5
