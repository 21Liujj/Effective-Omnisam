# experiments/pl_refiner/configs/R2_class_balanced_fullrun.yaml
# R2 class-balanced FULL-RUN.
# Refiner block is IDENTICAL to the validated R4 diag config's class_balance block
# (group-based schema actually read by adaptation/pseudo_label/class_balance.py).
# Only run-control differs: full epoch, no 5-step cap.
#
# experiment_id      : R2_class_balanced_fullrun
# refiner_mode       : class_balanced
# full_train_allowed : true
# NOTE: epoch-end val mIoU IS a legitimate result here.

pseudo_label_refiner:
  mode: "class_balanced"
  enable: true
  num_classes: 13
  ignore_index: 255

  class_balance:
    common_classes: [0, 1, 2, 8, 9, 10, 12]
    rare_classes: [3, 4, 5, 11]
    extreme_rare_classes: [6, 7]
    common_top_ratio: 0.50
    rare_top_ratio: 0.75
    extreme_rare_top_ratio: 0.80
    common_min_conf: 0.75
    rare_min_conf: 0.60
    extreme_rare_min_conf: 0.55
    min_pixels_per_class: 50
    num_classes: 13

  # Read-only per-step diagnostics. Writes one record per train step (~full epoch).
  prototype_diagnostics:
    enabled: true
    output_jsonl: "r2_class_balanced_fullrun_diag.jsonl"

plugins:
  # A: pseudo_conf_mask — same as validated A_Dtrain_Etrain config
  pseudo_conf_mask:
    enabled: true
    threshold: 0.85
    min_valid_ratio: 0.01
    min_valid_pixels: 0
    ignore_index: 255
    fallback: "skip"

  # D: Memory Compression — train-only, PL disabled
  efficient_tam_memory:
    enabled: true
    mode: "pool"
    compress_ratio: 0.5
    pool_stride: 2
    apply_in_pl: false
    apply_in_train: true

  # E: Sparse Memory Retrieval — train-only, PL disabled
  efficient_sam2_sparse:
    enabled: true
    mode: "attn_topk"
    keep_ratio: 0.5
    min_keep_tokens: 64
    saliency_source: "feature_norm"
    cache_saliency: true
    fallback_full_when_uncertain: true
    apply_in_pl: false
    apply_in_train: true

reuse_pl_dir: data_pd_exp_final_2000/base_last_20260425_232941/DensePASS/sam2_s/Cityscapes_13cls/epoch1
train_max_iters: 0
refiner_verbose_log: true
