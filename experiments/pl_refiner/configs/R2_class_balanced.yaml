# experiments/pl_refiner/configs/R2_class_balanced.yaml
# R2 class_balanced: class-wise top-ratio sampling on top of conf_mask.
# Adds class-balanced pseudo label selection to R1.
#
# experiment_id      : R2_class_balanced
# refiner_mode       : class_balanced
# use_class_balance  : true
# use_plq            : false
# use_prototype      : false
# use_correction     : false
# use_memory_consistency: false
# memory_config      : none
# full_train_allowed : true
# status             : NOT_IMPLEMENTED_YET — requires adaptation/pseudo_label/class_balance.py

pseudo_label_refiner:
  mode: "class_balanced"
  enable: true
  # class balance parameters (defaults, will be tuned in Phase 2)
  class_balance:
    top_ratio: 0.67          # keep top-67% confidence per class
    min_pixels_per_class: 10 # floor to avoid class starvation
    num_classes: 13

plugins:
  pseudo_conf_mask:
    enabled: true
    threshold: 0.85
  efficient_tam_memory:
    enabled: false
  efficient_sam2_sparse:
    enabled: false

reuse_pl_dir: data_pd_exp_final_2000/base_last_20260425_232941/DensePASS/sam2_s/Cityscapes_13cls/epoch1
train_max_iters: 5
