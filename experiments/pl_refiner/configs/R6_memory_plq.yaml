# experiments/pl_refiner/configs/R6_memory_plq.yaml
# R6 memory_plq: PLQ augmented with cross-frame memory consistency.
# Uses memory bank features to enforce temporal coherence on PLQ scores.
# (prototype gating omitted — Phase 6 will decide whether to add it)
#
# experiment_id      : R6_memory_plq
# refiner_mode       : memory_plq
# use_class_balance  : true
# use_plq            : true
# use_prototype      : false  (TBD Phase 6; conservative default)
# use_correction     : false
# use_memory_consistency: true
# memory_config      : default (SAM2 FIFO queue size=9, no D/E compression)
# full_train_allowed : conditional (feasibility scan required in Phase 6)
# status             : NOT_IMPLEMENTED_YET — requires adaptation/pseudo_label/plq.py memory path

pseudo_label_refiner:
  mode: "memory_plq"
  enable: true
  class_balance:
    top_ratio: 0.67
    min_pixels_per_class: 10
    num_classes: 13
  plq:
    use_entropy: true
    use_local_agreement: true
    local_kernel_size: 3
    weight_power: 1.0
  prototype:
    # NOTE: set to false pending Phase 6 feasibility scan
    enable: false
  memory_consistency:
    enable: true
    # Memory PLQ: use cross-frame memory features for consistency scoring.
    # Exact implementation TBD in Phase 6 Task 6-1.
    consistency_weight: 0.3   # blend with single-frame PLQ
    memory_queue_size: 9      # SAM2 default FIFO size

plugins:
  pseudo_conf_mask:
    enabled: true
    threshold: 0.85
  efficient_tam_memory:
    enabled: false
  efficient_sam2_sparse:
    enabled: false

reuse_pl_dir: data_pd_exp_final_2000/base_last_20260425_232941/DensePASS/sam2_s/Cityscapes_13cls/epoch1
train_max_iters: 5
